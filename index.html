<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141613" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Sattva — Ayurvedic Remedy Guidance</title>
    <meta
      name="description"
      content="Describe how you're feeling and receive calm, structured Ayurvedic remedy guidance drawn from a curated knowledge base — with clear precautions and advice on when to seek professional care."
    />
    <meta name="author" content="Mukul Negi" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sattva — Ayurvedic Remedy Guidance" />
    <meta
      property="og:description"
      content="Calm, structured Ayurvedic remedy guidance from a curated knowledge base. Not a substitute for professional medical advice."
    />
    <meta name="twitter:card" content="summary" />

    <script>
      // Set the theme before first paint so there is no flash. Mirrors the
      // resolution order in src/hooks/useTheme.ts.
      (function () {
        try {
          // Portfolio embed/link contract: ?cp-mode=light|dark wins over storage.
          var cp = new URLSearchParams(location.search).get("cp-mode");
          var stored = cp === "light" || cp === "dark" ? cp : localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <!-- Critical: the ground colour, before the CSS bundle resolves, so the
         opening reveal never starts on a white flash. -->
    <style>
      :root { background: #f7f5f0; }
      :root[data-theme="dark"] { background: #141613; }
      body { margin: 0; }
    </style>
    <script>
      // Portfolio preview contract. Only when framed AND opened with ?cp-mode:
      // hide this document's own scrollbar (scrolling itself is untouched) and
      // tell the parent whether there is more to scroll, so it can draw a small
      // arrow instead. Carries two booleans, nothing else.
      (function () {
        try {
          if (window.top === window || !/[?&]cp-mode=/.test(location.search)) return;
          var css = document.createElement("style");
          css.textContent = "html{scrollbar-width:none}html::-webkit-scrollbar{display:none}";
          document.head.appendChild(css);
          var last = "";
          function report() {
            var e = document.scrollingElement || document.documentElement;
            var down = e.scrollHeight - e.clientHeight > 2 && e.scrollTop + e.clientHeight < e.scrollHeight - 2;
            var right = e.scrollWidth - e.clientWidth > 2 && e.scrollLeft + e.clientWidth < e.scrollWidth - 2;
            var key = down + "," + right;
            if (key === last) return;
            last = key;
            parent.postMessage({ type: "cp-scroll", down: down, right: right }, "*");
          }
          addEventListener("scroll", report, { passive: true });
          addEventListener("resize", report);
          addEventListener("load", report);
          // Content height changes without any scroll/resize event, so also
          // re-check (debounced) when the DOM or the body's size changes.
          var timer;
          function later() {
            clearTimeout(timer);
            timer = setTimeout(report, 120);
          }
          document.addEventListener("DOMContentLoaded", function () {
            if (window.ResizeObserver) new ResizeObserver(later).observe(document.body);
            new MutationObserver(later).observe(document.documentElement, { childList: true, subtree: true });
            report();
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
